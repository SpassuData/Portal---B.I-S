{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Portal BI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { font-family: 'Century Gothic', 'CenturyGothic', AppleGothic, 'Trebuchet MS', sans-serif; }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex flex-col">

<header class="bg-[#201547] text-white px-8 py-3 flex justify-between items-center shadow-lg">

    <a href="/" class="flex items-center gap-4">
        <img src="{% static 'logo.png' %}" alt="Spassu" class="h-8 object-contain">
        <div class="border-l border-white/20 pl-4">
            <p class="text-white/60 text-xs tracking-wider">Portal de BI &mdash; Central de Indicadores</p>
        </div>
    </a>

    <div class="flex items-center gap-4">
        <div class="text-right hidden sm:block">
            <p class="text-sm font-medium leading-none">{{ user.name }}</p>
            <p class="text-white/50 text-xs mt-0.5">{{ user.preferred_username }}</p>
        </div>
        <div class="w-9 h-9 bg-[#FA4616] text-white rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0">
            {{ user.name|first|upper }}
        </div>
        <a href="/logout/"
           class="flex items-center gap-1.5 bg-white/10 hover:bg-white/20 text-white text-sm px-3 py-1.5 rounded-lg transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Sair
        </a>
    </div>

</header>

<main class="flex-1">
    {% block content %}{% endblock %}
</main>

<footer class="text-center text-gray-400 py-4 text-xs border-t border-gray-200 bg-white">
    Versão Única da Verdade &copy; 2026 &mdash; Iniciativa de Governança de Dados &mdash; <span class="text-[#FA4616]">spassu</span>
</footer>

</body>
</html>
