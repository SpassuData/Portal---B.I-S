{% extends "base.html" %}

{% block content %}

<div class="p-6 max-w-7xl mx-auto">

    <h2 class="text-2xl font-semibold mb-6 text-gray-700">
        Dashboards Estratégicos
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <!-- RH -->
        <div onclick="window.open('{{ dashboards.rh }}')" 
             class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all cursor-pointer p-6">

            <div class="h-2 bg-[#ff8c00] rounded-t-xl"></div>

            <div class="mt-4">
                <div class="text-4xl">👥</div>
                <h3 class="text-xl font-semibold mt-2">Gestão de Jornada</h3>
                <p class="text-gray-600 mt-2">
                    Indicadores de RH, Folha e Horas Extras
                </p>

                <button class="mt-4 px-4 py-2 bg-[#ff8c00] text-white rounded-lg">
                    Acessar Dashboard
                </button>
            </div>
        </div>

        <!-- Financeiro -->
        <div onclick="window.open('{{ dashboards.fin }}')" 
             class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all cursor-pointer p-6">

            <div class="h-2 bg-[#004a99] rounded-t-xl"></div>

            <div class="mt-4">
                <div class="text-4xl">💰</div>
                <h3 class="text-xl font-semibold mt-2">Gestão Financeira</h3>
                <p class="text-gray-600 mt-2">
                    DRE, Fator K e Provisões estratégicas
                </p>

                <button class="mt-4 px-4 py-2 bg-[#004a99] text-white rounded-lg">
                    Acessar Dashboard
                </button>
            </div>
        </div>

        <!-- Operacional -->
        <div onclick="window.open('{{ dashboards.op }}')" 
             class="bg-white rounded-xl shadow-md hover:shadow-xl transition-all cursor-pointer p-6">

            <div class="h-2 bg-[#2ecc71] rounded-t-xl"></div>

            <div class="mt-4">
                <div class="text-4xl">⚙️</div>
                <h3 class="text-xl font-semibold mt-2">Eficiência Operacional</h3>
                <p class="text-gray-600 mt-2">
                    Status de projetos e integração de sistemas
                </p>

                <button class="mt-4 px-4 py-2 bg-[#2ecc71] text-white rounded-lg">
                    Acessar Dashboard
                </button>
            </div>
        </div>

    </div>
</div>

{% endblock %}
